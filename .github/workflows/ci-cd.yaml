name: Test Self Hosted Runner

on:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test runner
        run: |
          echo "Hello from my Mac self-hosted runner!"
          echo "Runner is working!"
          node --version
          docker --version
          kubectl version --client
