name: Node.js CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  IMAGE_NAME: harsh4244rao/my-node-app

jobs:

  build-test-push:

    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Install dependencies
        run: npm ci

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | \
          docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Push Docker image
        run: |
          docker push \
            $IMAGE_NAME:${{ github.sha }}

  deploy:

    needs: build-test-push

    runs-on: self-hosted

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/my-node-app \
            node-app=$IMAGE_NAME:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/my-node-app \
            --timeout=180s
